# Jaeger v2 all-in-one: OTLP collector + UI, in-memory storage (traces are lost on restart).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          env:
            - { name: JAEGER_LISTEN_HOST, value: 0.0.0.0 }  # the default listens on localhost only
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
spec:
  type: NodePort  # kind maps node port 30686 to 127.0.0.1:16686
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui, nodePort: 30686 }
