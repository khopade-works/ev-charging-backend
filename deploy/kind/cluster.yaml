# Local cluster: 1 control plane + 2 workers so replicas and the database can land on different nodes.
# Host ports bind to 127.0.0.1 only; nothing is reachable from the LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ev
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, listenAddress: "127.0.0.1" }   # app
      - { containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1" }   # Grafana
      - { containerPort: 30090, hostPort: 9090, listenAddress: "127.0.0.1" }   # Prometheus
      - { containerPort: 30686, hostPort: 16686, listenAddress: "127.0.0.1" }  # Jaeger UI
  - role: worker
  - role: worker
