apiVersion: v1
kind: Service
metadata:
  name: ev-charging
  labels:
    {{- include "ev.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    {{- include "ev.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30080 }
---
# Separate ClusterIP so /metrics is never reachable through the public NodePort.
apiVersion: v1
kind: Service
metadata:
  name: ev-charging-metrics
  labels:
    {{- include "ev.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "ev.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: metrics, port: 9000, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: ev-charging-db
  labels:
    {{- include "ev.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    {{- include "ev.selector" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
