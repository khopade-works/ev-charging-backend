{{- if and .Values.monitoring.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ev-charging
  labels:
    {{- include "ev.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ev.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      interval: 15s
{{- end }}
