apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ev-charging-db
spec:
  serviceName: ev-charging-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ev-charging, app.kubernetes.io/component: database }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ev-charging, app.kubernetes.io/component: database }
    spec:
      automountServiceAccountToken: false
      securityContext:  # 70 is postgres in the alpine image; fsGroup makes the volume writable for it
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - { name: POSTGRES_USER, value: ev }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ev-charging-db, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }  # initdb refuses a volume root with lost+found
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:  # over TCP: during init Postgres listens only on its socket
            exec: { command: [pg_isready, -U, ev, -h, 127.0.0.1] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ev-charging-db
spec:
  clusterIP: None  # headless: a stable DNS name for the StatefulSet's pod
  selector: { app.kubernetes.io/name: ev-charging, app.kubernetes.io/component: database }
  ports:
    - { port: 5432 }
---
# Only API pods may reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ev-charging-db
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ev-charging, app.kubernetes.io/component: database }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: ev-charging, app.kubernetes.io/component: api }
      ports:
        - { port: 5432 }
