name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/khopade-works/ev-charging-backend
  # On a PR, github.sha is a temporary merge commit; build the PR head, so the image tag, /version and
  # `gh run list --commit` (the gate in scripts/deploy.sh) all name the same commit.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ev, POSTGRES_PASSWORD: ev }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    steps:
      # Actions are pinned by commit SHA: tags can be moved (trivy-action's were hijacked in March 2026).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.SHA }}", persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - run: pip install ".[test]"
      - run: pytest -q
      - name: Race test with 2 replicas on one Postgres
        run: pytest -q tests/test_concurrency.py
        env: { EV_TEST_DATABASE_URL: "postgresql://ev:ev@localhost:5432/ev" }
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: { version: v0.70.0 }
      - name: Committed secrets and Dockerfile/Helm/manifest misconfigurations
        run: trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.SHA }}", persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          push: true
          platforms: linux/amd64,linux/arm64  # runners are amd64; the local kind cluster on Apple Silicon is arm64
          tags: ${{ env.IMAGE }}:${{ env.SHA }}  # immutable: one image per commit, never `latest`
          build-args: GIT_SHA=${{ env.SHA }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: { version: v0.70.0 }
      - name: Image CVEs (dependencies and OS packages)
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE@${{ steps.push.outputs.digest }}"
