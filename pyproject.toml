[project]
name = "ev-charging"
version = "0.1.0"
description = "Backend for an EV charging network (machine-coding exercise)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
