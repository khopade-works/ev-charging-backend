[project]
name = "ev-charging"
version = "0.2.0"
description = "Backend for an EV charging network (machine-coding exercise)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-psycopg>=0.51b0",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "httpx2>=2.13",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W"]
