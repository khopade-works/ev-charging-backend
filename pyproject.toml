[project]
name = "ev-charging"
version = "0.1.0"
description = "Backend for an EV charging network (machine-coding exercise)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "opentelemetry-distro>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-psycopg>=0.51b0",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "httpx2>=2.13",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
lint.select = ["E4", "E7", "E9", "F"]  # ruff <0.17 defaults; the baseline code predates the wider set
